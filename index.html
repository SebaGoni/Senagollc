<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MDQ Flooring | Pisos flotantes melamínicos, SPC, PVC, Deck WPC y Wall Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MDQ Flooring. Venta e instalación profesional de pisos flotantes, vinílicos, deck WPC y wall panel en Mar del Plata.">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* GLOBAL */
        body { font-family: 'Inter', sans-serif; background: #fafafa; color: #1c1c1c; scroll-behavior: smooth; }
        h1,h2,h3,h4,h5,h6 { font-family: 'Montserrat', sans-serif; }

        /* NAVBAR */
        .navbar {
            background-color: rgba(0,0,0,0.85);
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        .navbar .navbar-brand .logo { height: 70px; }
        @media(max-width:768px){ .navbar .navbar-brand .logo{height:50px;} }
        .navbar .navbar-brand, .navbar .nav-link { color: #fff !important; font-weight: 500; }
        .nav-link:hover { color: #f0c14b !important; }

        /* HERO */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            padding-top: 120px;
        }
        .hero-bg {
            position: absolute;
            inset:0;
            background: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c') no-repeat center center;
            background-size: cover;
            z-index:0;
        }
        .hero::before{
            content:"";
            position:absolute;
            inset:0;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65));
            z-index:0;
        }
        .hero-content{
            position: relative;
            z-index:1;
            text-align:center;
            padding: 30px 25px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 15px;
            max-width: 800px;
            margin-top: -50px;
        }

        /* SECTIONS */
        section{padding:100px 0;}

        /* SERVICE CARDS */
        .service-card{
            position: relative;
            height: 320px;
            border-radius: 22px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color:#fff;
            background-size: cover;
            background-position:center;
            box-shadow:0 25px 50px rgba(0,0,0,.25);
            overflow:hidden;
            cursor:pointer;
        }
        .service-card::before{
            content:"";
            position:absolute;
            inset:0;
            background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.25));
        }

        /* GALLERY */
        .gallery img{border-radius:18px; cursor:pointer;}

        /* CONTACT */
        .contact-box{
            background:#111;
            color:#fff;
            border-radius:25px;
            padding:60px;
        }

        /* FOOTER */
        footer{
            padding:40px 0;
            background:#0f0f0f;
            color:#aaa;
            text-align:center;
        }

        /* WhatsApp */
        .whatsapp{
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#"><img src="assets/img/logo.png" class="logo"></a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="#trabajos">Trabajos</a></li>
                <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>

        </div>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-bg"></div>
    <div class="container hero-content">

    </div>
</section>

<!-- SERVICIOS -->
<section id="servicios">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="service-card"
                     style="background-image:url('assets/img/pisos-flotantes.jpg')"

                </div>
            </div>
            <div class="col-md-4">
                <div class="service-card"

                     data-bs-toggle="modal" data-bs-target="#modalDeck">
                    <h4>Deck WPC</h4>
                </div>
            </div>
            <div class="col-md-4">
                <div class="service-card"
                     style="background-image:url('assets/img/wall-panel.jpg')"
                     data-bs-toggle="modal" data-bs-target="#modalWall">

        </div>

</section>

<!-- TRABAJOS -->
<section id="trabajos" class="bg-light">

                <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7"
                     class="img-fluid"
                     data-bs-toggle="modal" data-bs-target="#modalTrabajos">
            </div>
            <div class="col-md-4">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
                     class="img-fluid"
                     data-bs-toggle="modal" data-bs-target="#modalTrabajos">
            </div>
            <div class="col-md-4">
                <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6"
                     class="img-fluid"
                     data-bs-toggle="modal" data-bs-target="#modalTrabajos">
            </div>
        </div>
    </div>
</section>

<!-- CONTACTO -->
<section id="contacto">
    <div class="container">
        <div class="contact-box">
            <h2 class="text-center mb-4">Presupuesto sin compromiso</h2>
            <form>
                <input class="form-control mb-3" placeholder="Nombre">
                <input class="form-control mb-3" placeholder="Email">
                <textarea class="form-control mb-3" placeholder="Mensaje"></textarea>
                <button class="btn btn-warning w-100">Enviar</button>
            </form>
        </div>
    </div>
</section>

<!-- MODALES -->

    </div>

</div>

    </div>
  </div>

<!-- Wall -->

  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">

  </div>
</div>

<!-- Trabajos -->

  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">

        <img class="col-md-4 img-fluid rounded" src="https://images.unsplash.com/photo-1615529182904-14819c35db37">
